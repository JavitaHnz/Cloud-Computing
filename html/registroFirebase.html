<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro Firebase</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-productos">

    <nav class="menu">
        <a href="../index.html">Inicio</a>
        <a href="informacion.html">Registro Local</a>
        <a href="productos.html">Productos Local</a>
        <a href="registroFirebase.html">Registro Firebase</a>
        <a href="productosFirebase.html">Productos Firebase</a>
    </nav>

    <section id="registro">

        <div class="contenedor">

            <h1>Registro Firebase</h1>

            <div class="form-productos">

                <div class="campo">
                    <label for="idProducto">ID Producto</label>
                    <input type="number" id="idProducto" placeholder="Ej: 001">
                </div>

                <div class="campo">
                    <label for="nombreProducto">Nombre del Producto</label>
                    <input type="text" id="nombreProducto" placeholder="Ej: Arroz">
                </div>

                <div class="campo">
                    <label for="precioProducto">Precio del Producto</label>
                    <input type="number" id="precioProducto" placeholder="Ej: 1500">
                </div>

                <div class="campo">
                    <label for="stockProducto">Stock</label>
                    <input type="number" id="stockProducto" placeholder="Ej: 20">
                </div>

                <button id="btnGuardarFirebase">
                    Guardar en Firebase
                </button>

            </div>

        </div>

    </section>

    <script type="module" src="../js/productosFirebase.js"></script>

</body>

</html>
